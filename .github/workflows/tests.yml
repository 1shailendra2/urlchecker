name: Run API tests
on: push
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      -  name: Get the code
         uses: actions/checkout@v4
      -  name: Set up Python
         uses: actions/setup-python@v4
         with:
          python-version: '3.12'
      -  name: Install dependencies
         run:  pip install pytest requests
      -  name: Run tests
         run:  pytest api_tests test_logentry.py test_lvlfunc.py
            